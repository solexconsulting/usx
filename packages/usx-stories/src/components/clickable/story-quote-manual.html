{% load components %}
{% clickable href=href className=className %}
    <div class="usx-callout usx-callout--vertical border-info usx-callout--big usx-quote">
        <figure class="usx-quote__body">
            <blockquote class="usx-quote__content font-serif-lg">
                ❝We found this wand shop that had the best wands, and we were like, "We have to go here!" So we went there.❞
            </blockquote>
            <figcaption class="usx-quote__attribution">
                <div class="usx-attribution">
                    <span class="usx-attribution__content">
                        <span class="usx-attribution__primary">
                            John Doe
                        </span>
                        <span class="usx-attribution__secondary">
                            Under Secretary for the Department of Magic and Mystical Affairs
                        </span>
                    </span>
                </div>
            </figcaption>
            <div class="display-flex flex-align-center margin-top-2">
                {% clickable_bg_color_change className="usx-circle bg-black text-white display-flex flex-align-center flex-justify-center width-4 height-4" %}
                    {% icon name="arrow_forward" size=3 %}{% endicon %}
                {% endclickable_bg_color_change %}
                {% clickable_link className="margin-left-1" %}
                    Read John's Story
                {% endclickable_link %}
            </div>
        </figure>
    </div>
{% endclickable %}
