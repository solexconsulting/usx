<h3 id="back-to-top" class="site-preview-heading">Back to top</h3>
<div class="display-flex flex-column flex-justify"
  style="height: 2000px; background-color: #8b8b8b; margin-bottom: 1rem;">
  <p style="padding: 1rem; color: white;">Scroll down to see the back to top button.</p>
  <hr style="width: 100%; color: white;" />
  <p style="padding: 1rem; color: white;">Keep scrolling...</p>
  <hr style="width: 100%; color: white;" />
  <p style="padding: 1rem; color: white;">Almost there...</p>
  <hr style="width: 100%; color: white;" />
  <p style="padding: 1rem; color: white;">You made it!</p>
</div>
<div class="display-flex flex-wrap">
  <div class="display-flex flex-column flex-justify-start flex-align-self-start">
    <button class="usa-button usx-button usx-button--ghost" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">
      Back to top
      <svg class="usa-icon usa-icon--size-2" aria-hidden="true" focusable="false" role="img">
        <use href="./img/sprite.svg#arrow_upward"></use>
      </svg>
    </button>
    <button class="usa-button usx-button usa-button--primary usx-button--ghost"
