{# Django template for Label #}
{% load components %}
<label
  class="
  {% if classOverride %}
    {{ className }}
  {% else %}
    usa-label usx-label
    {{ className }}
    {% if screenReaderOnly %}
      usa-sr-only
    {% endif %}
    {% if error %}
      usa-label--error
    {% endif %}
  {% endif %}
  "
  {% if htmlFor %}
    for="{{ htmlFor }}"
  {% endif %}
>
  {% if required %}{% required %}{% endrequired %}{% endif %}{% if children %}{{ children }}{% else %}{{ label|default:"" }}{% endif %}
</label>
