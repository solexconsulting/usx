{% load components %}

<div class="usx-tag-group{% if className %} {{ className }}{% endif %}">
  {% if children %}
    {{ children|safe }}
  {% elif tags %}
    {% for tag in tags %}
      {% tag big=tag.big value=tag.value color=tag.color|default:'' className=tag.className|default:'' %}{% endtag %}
    {% endfor %}
  {% endif %}
</div>
