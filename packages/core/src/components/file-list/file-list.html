<!-- Default (static snapshot; interactive Delete requires React) -->
<div class="usx-file-input__list margin-top-1">
  <span class="usa-hint usx-hint usx-file-input__list-heading">Selected files</span>
  <ul class="usx-file-input__file-list">
    <li class="usx-file-input__file-item">
      <div class="usx-file-input__file-info">
        <span class="usx-file-input__file-name">test1.jpg</span>
        <span class="usx-file-input__file-size">JPG, 7 KB</span>
      </div>
      <button type="button" class="usa-button usx-button usa-button--secondary usx-file-input__delete-button">
        <svg class="usa-icon usx-file-input__delete-icon" aria-hidden="true" focusable="false" role="img">
          <use href="./img/sprite.svg#delete"></use>
        </svg>
        <span class="usx-file-input__delete-label">Delete</span>
      </button>
    </li>
    <li class="usx-file-input__file-item">
      <div class="usx-file-input__file-info">
        <span class="usx-file-input__file-name">test2.jpg</span>
        <span class="usx-file-input__file-size">JPG, 7 KB</span>
      </div>
      <button type="button" class="usa-button usx-button usa-button--secondary usx-file-input__delete-button">
        <svg class="usa-icon usx-file-input__delete-icon" aria-hidden="true" focusable="false" role="img">
          <use href="./img/sprite.svg#delete"></use>
        </svg>
        <span class="usx-file-input__delete-label">Delete</span>
      </button>
    </li>
  </ul>
</div>
