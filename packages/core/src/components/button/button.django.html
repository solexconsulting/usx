{% load components %}

{# build classes inline to avoid {% with %} scoping issues #}

{% if href %}
    <a
        href="{{ href }}"
        class="
            usa-button usx-button
            {% if variant %} usa-button--{{ variant }}{% endif %}
            {% if big %} usa-button--big{% endif %}
            {% if disabled %} usa-button--disabled{% endif %}
            {% if inverse %} usa-button--inverse{% endif %}
            {% if className %} {{ className }}{% endif %}
        "
        {% if disabled %} disabled="disabled" aria-disabled="true" {% endif %}
        {% if isExternal %} target="_blank" rel="noopener noreferrer" {% endif %}
    >
{% else %}

    <button
        type="{{ type }}"
        class="
            usa-button usx-button
            {% if variant %} usa-button--{{ variant }}{% endif %}
            {% if big %} usa-button--big{% endif %}
            {% if disabled %} usa-button--disabled{% endif %}
            {% if inverse %} usa-button--inverse{% endif %}
            {% if className %} {{ className }}{% endif %}
        "
        {% if disabled %} disabled="disabled" aria-disabled="true" {% endif %}
    >
{% endif %}
    {% if leftIcon %}
        {% icon name=leftIcon.name color=leftIcon.color size=leftIcon.size %}
    {% endif %}

    {{ label }}

    {% if rightIcon %}
        {% icon name=rightIcon.name color=rightIcon.color size=rightIcon.size %}
    {% endif %}

{% if href %}
    </a>
{% else %}
    </button>
{% endif %}
