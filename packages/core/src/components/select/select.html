<form class="usa-form">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label" for="options">Dropdown label</label>
    <select class="usa-select usx-select" name="options" id="options">
      <option value>- Select -</option>
      <option value="value1">Option A</option>
      <option value="value2">Option B</option>
      <option value="value3">Option C</option>
    </select>
  </div>
</form>

<form class="usa-form">
  <div class="usa-form-group usx-form-group usa-form-group--error">
    <label class="usa-label" for="select-with-error">Dropdown label</label>
    <span id="select-with-error-hint" class="usa-hint usx-hint">This is a select with an error message.</span>
    <span id="select-with-error-error" class="usa-error-message usx-error-message" role="alert">Selection error message</span>
    <select id="select-with-error" class="usa-select usx-select usa-input--error" name="options" aria-describedby="select-with-error-hint select-with-error-error" aria-invalid="true">
      <option value>- Select -</option>
      <option value="value1">Option A</option>
      <option value="value2">Option B</option>
      <option value="value3">Option C</option>
    </select>
  </div>
</form>

<form class="usa-form">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label" for="select-with-success">Success state select</label>
    <select class="usa-select usx-select usa-input--success" name="options" id="select-with-success">
      <option value>- Select -</option>
      <option value="value1">Option A</option>
      <option value="value2">Option B</option>
      <option value="value3">Option C</option>
    </select>
    <span class="usa-success-message">Success message goes here.</span>
  </div>
</form>

<form class="usa-form">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label" for="select-disabled">Disabled select</label>
    <select class="usa-select usx-select" id="select-disabled" name="options" disabled="disabled">
      <option value>- Select -</option>
      <option value="value1">Option A</option>
      <option value="value2">Option B</option>
      <option value="value3">Option C</option>
    </select>
  </div>
</form>

<form class="usa-form">
  <div class="usa-form-group usx-form-group usa-form-group--error">
    <label class="usa-label" for="select-disabled-error">Disabled with error</label>
    <select class="usa-select usx-select usa-input--error" id="select-disabled-error" name="options" disabled="disabled">
      <option value>- Select -</option>
      <option value="value1">Option A</option>
      <option value="value2">Option B</option>
      <option value="value3">Option C</option>
    </select>
  </div>
</form>
