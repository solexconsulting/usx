{# Django template for Page #}
<main{% if id %} id="{{ id }}"{% endif %} class="usx-page{% if className %} {{ className }}{% endif %}">
  <h1 class="usx-page__title">{% if eyebrow %}<span class="usx-eyebrow">{{ eyebrow }}</span>{% endif %}{{ title|default:'Page title' }}</h1>
  <div class="usx-page__content">{{ content|default:''|safe }}</div>
</main>
