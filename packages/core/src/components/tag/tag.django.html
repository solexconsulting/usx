{# Django template for Tag #}
{% load components %}

<span class=
  "
  usa-tag usx-tag
  {% if big %}usa-tag--big{% endif %}
  {% if color and not outline %}bg-{{ color }}{% endif %}
  {% if color and outline %}text-{{ color }}{% endif %}
  {% if outline %}usx-tag--outline{% endif %}
  {{ className }}
  "
>
  {% if icon %}{% icon name=icon size="3" %}{% endicon %}{% endif %}{{ children | default:value }}
</span>
