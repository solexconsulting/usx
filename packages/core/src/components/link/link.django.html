{# Django template for Link #}
<a
  href="{{ href|default:'javascript:void(0);' }}"
  class="usa-link usx-link{% if visited %} usx-link--visited{% endif %}{% if external %} usa-link--external{% endif %}{% if alt %} usa-link--alt{% endif %}{% if className %} {{ className }}{% endif %}"
  {% if newTab or external %}target="_blank" rel="noreferrer noopener"{% endif %}
>{{ children|safe }}</a>
