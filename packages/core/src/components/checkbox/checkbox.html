<h3 class="site-preview-heading margin-bottom-0">Default</h3>
<fieldset class="usa-fieldset">
  <legend class="usa-legend">Select any historical figure</legend>
  <div class="usa-checkbox usx-checkbox">
    <input
      class="usa-checkbox__input"
      id="check-historical-truth-default"
      type="checkbox"
      name="historical-figures"
      value="sojourner-truth"
      checked="checked"
    />
    <label class="usa-checkbox__label" for="check-historical-truth-default"
      >Sojourner Truth</label
    >
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input
      class="usa-checkbox__input"
      id="check-historical-douglass-default"
      type="checkbox"
      name="historical-figures"
      value="frederick-douglass"
    />
    <label class="usa-checkbox__label" for="check-historical-douglass-default"
      >Frederick Douglass</label
    >
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input
      class="usa-checkbox__input"
      id="check-historical-washington-default"
      type="checkbox"
      name="historical-figures"
      value="booker-t-washington"
    />
    <label class="usa-checkbox__label" for="check-historical-washington-default"
      >Booker T. Washington</label
    >
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input
      class="usa-checkbox__input"
      id="check-historical-carver-default"
      type="checkbox"
      name="historical-figures"
      value="george-washington-carver"
      disabled="disabled"
    />
    <label class="usa-checkbox__label" for="check-historical-carver-default"
      >George Washington Carver</label
    >
  </div>
</fieldset>
