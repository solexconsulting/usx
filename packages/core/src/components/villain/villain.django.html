{# Django template for Villain #}
<section class="usa-hero {% if className %} {{ className }}{% endif %}" aria-label="{% if ariaLabel %}{{ ariaLabel }}{% else %}Introduction{% endif %}">
  <div class="grid-container">
    <div class="usa-hero__callout">
      <h1 class="usa-hero__heading">
        {% if callout %}
          <span class="usa-hero__heading--alt">{{ callout }}</span>
        {% endif %}
        {{ title }}
      </h1>
      {% if paragraph %}
        <p>{{ paragraph }}</p>
      {% endif %}
      {% if button %}
        <a class="usa-button" href="{{ button.href }}">{{ button.text }}</a>
      {% endif %}
    </div>
  </div>
</section>
