{# Django template for TimePicker #}
<div class="usa-form-group usx-form-group{% if error %} usa-form-group--error{% endif %}">
  {% if label %}
  <label class="usa-label usx-label" id="{{ id }}-label" for="{{ id }}">
    {% if required %}<abbr title="required" class="usx-required">*</abbr>{% endif %}{{ label }}
  </label>
  {% endif %}

  {% if hint %}
  <div class="usa-hint usx-hint" id="{{ id }}-hint">{{ hint }}</div>
  {% endif %}

  {% if error %}
  <span class="usa-error-message usx-error-message" id="{{ id }}-error" role="alert">{{ error }}</span>
  {% endif %}

  <div
    class="usa-time-picker usx-time-picker{% if className %} {{ className }}{% endif %}"
    {% if minTime %} data-min-time="{{ minTime }}"{% endif %}
    {% if maxTime %} data-max-time="{{ maxTime }}"{% endif %}
    {% if step %} data-step="{{ step }}"{% endif %}
  >
    <input
      class="usa-input usx-input"
      id="{{ id }}"
      name="{{ name|default:id }}"
      type="text"
      {% if label or hint or error %} aria-describedby="{% if label %}{{ id }}-label{% endif %}{% if label and hint %} {% endif %}{% if hint %}{{ id }}-hint{% endif %}{% if hint and error %} {% endif %}{% if not hint and label and error %} {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}
      {% if defaultValue %} value="{{ defaultValue }}"{% endif %}
      {% if disabled %} disabled{% elif ariaDisabled %} aria-disabled="true"{% endif %}
      {% if required %} required{% endif %}
    />
  </div>
</div>
