<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" id="appointment-date-label" for="appointment-date"
    >Appointment date</label
  >
  <div class="usa-hint usx-hint" id="appointment-date-hint">mm/dd/yyyy</div>
  <div class="usa-date-picker usx-date-picker">
    <input
      class="usa-input usx-input"
      id="appointment-date"
      name="appointment-date"
      aria-labelledby="appointment-date-label"
      aria-describedby="appointment-date-hint"
    />
  </div>
</div>
