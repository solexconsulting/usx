{% load components %}

{% if ordered %}
<ol class="usa-list usx-list{% if unstyled %} usa-list--unstyled{% endif %}{% if className %} {{ className }}{% endif %}">
  {% for item in items %}
    <li>{{ item }}</li>
  {% endfor %}
</ol>
{% else %}
<ul class="usa-list usx-list{% if unstyled %} usa-list--unstyled{% endif %}{% if className %} {{ className }}{% endif %}">
  {% for item in items %}
    <li>{{ item }}</li>
  {% endfor %}
</ul>
{% endif %}
