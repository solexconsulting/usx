<div class="usa-alert usa-alert--warning usx-alert usx-alert--warning">
  <div class="usa-alert__body usx-alert__body">
    <h4 class="usa-alert__heading usx-alert__heading">Accessibility Notice</h4>
    <p class="usa-alert__text usx-alert__text">
      Please note: The toggle component is undergoing maintenance for accessibility issues.
    </p>
  </div>
</div>


<h3 class="site-preview-heading">Default</h3>
<ul class="usa-button-group usx-button-group usa-button-group--segmented usx-toggle" role="radiogroup" aria-label="alignment">
  <li class="usa-button-group__item usx-toggle__item">
    <input class="usx-toggle__input" type="radio" id="toggle-left" name="toggle-example" value="left">
    <label for="toggle-left" class="usa-button usx-button usa-button--outline"><span class="usx-toggle__label">Left</span></label>
  </li>
  <li class="usa-button-group__item usx-toggle__item">
    <input class="usx-toggle__input" type="radio" id="toggle-center" name="toggle-example" value="center" checked>
    <label for="toggle-center" class="usa-button usx-button usa-button--outline"><span class="usx-toggle__label">Center</span></label>
  </li>
  <li class="usa-button-group__item usx-toggle__item">
    <input class="usx-toggle__input" type="radio" id="toggle-right" name="toggle-example" value="right">
    <label for="toggle-right" class="usa-button usx-button usa-button--outline"><span class="usx-toggle__label">Right</span></label>
  </li>
</ul>
