{% load components %}
<ul class="usa-card-group usx-card-group{% if className %} {{ className }}{% endif %}">
  {% for card in cards %}
    {% card tag='li' title=card.title description=card.description footer=card.footer actions=card.actions images=card.images flag=card.flag mediaRight=card.mediaRight headerFirst=card.headerFirst className=card.className %}{% endcard %}
  {% endfor %}
</ul>
