{# Django template for Combobox #}
{% load components %}
<label class="usa-label usx-label" for="{{ id }}">
  {% if required %}<abbr title="required" class="usx-required">*</abbr>{% endif %}{{ label }}
</label>

{% if hint %}
<span class="usa-hint usx-hint" id="{{ id }}-hint">{{ hint }}</span>
{% endif %}

{% if error %}
<span class="usa-error-message usx-error-message" id="{{ id }}-error">{{ error }}</span>
{% endif %}

<div class="usa-combo-box usx-combo-box{% if error %} usx-combo-box--error{% endif %}{% if className %} {{ className }}{% endif %}"{% if placeholder %} data-placeholder="{{ placeholder }}"{% endif %}{% if defaultValue %} data-default-value="{{ defaultValue }}"{% endif %}>
  <select
    id="{{ id }}"
    class="usa-select usx-select"
    name="{{ name }}"
    {% if disabled %} disabled{% endif %}
    {% if required %} required{% endif %}
    {% if hint or error %} aria-describedby="{% if hint %}{{ id }}-hint{% endif %}{% if hint and error %} {% endif %}
    {% if error %}{{ id }}-error{% endif %}"{% endif %}
    {% if onSelect %} onchange="{{ onSelect }}"{% endif %}
  >
    {% for option in options %}
    <option value="{{ option.value }}">{{ option.label }}</option>
    {% endfor %}
  </select>
</div>
