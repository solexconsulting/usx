<!-- Default -->
<label class="usa-label usx-label" for="range-slider-default">Range slider</label>
<span class="usa-hint usx-hint" id="range-slider-default-hint">Move the slider to change the value</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-default"
  type="range"
  name="range-slider-default"
  min="0"
  max="100"
  step="10"
  value="20"
  aria-describedby="range-slider-default-hint"
/>

<!-- WithUnit -->
<label class="usa-label usx-label" for="range-slider-unit">Volume</label>
<span class="usa-hint usx-hint" id="range-slider-unit-hint">Adjust the volume level</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-unit"
  type="range"
  name="range-slider-unit"
  min="0"
  max="100"
  step="10"
  value="50"
  data-text-unit="percent"
  aria-describedby="range-slider-unit-hint"
/>

<!-- WithPreposition -->
<label class="usa-label usx-label" for="range-slider-preposition">Rango deslizante</label>
<span class="usa-hint usx-hint" id="range-slider-preposition-hint">Mueva el control deslizante para cambiar el valor</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-preposition"
  type="range"
  name="range-slider-preposition"
  min="0"
  max="100"
  step="10"
  value="20"
  data-text-preposition="de"
  aria-describedby="range-slider-preposition-hint"
/>

<!-- FineStep -->
<label class="usa-label usx-label" for="range-slider-fine-step">Fine-grained slider</label>
<span class="usa-hint usx-hint" id="range-slider-fine-step-hint">Move the slider to change the value by 1</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-fine-step"
  type="range"
  name="range-slider-fine-step"
  min="0"
  max="100"
  step="1"
  value="20"
  aria-describedby="range-slider-fine-step-hint"
/>

<!-- CustomRange -->
<label class="usa-label usx-label" for="range-slider-custom-range">Target price</label>
<span class="usa-hint usx-hint" id="range-slider-custom-range-hint">Move the slider to select a price target between 50 and 150</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-custom-range"
  type="range"
  name="range-slider-custom-range"
  min="50"
  max="150"
  step="10"
  value="90"
  aria-describedby="range-slider-custom-range-hint"
/>

<!-- WithError -->
<label class="usa-label usx-label usa-label--error" for="range-slider-error">Range slider</label>
<span class="usa-error-message usx-error-message" id="range-slider-error-error" role="alert">Select a value within the allowed range</span>
<input
  class="usa-range usx-range-slider"
  id="range-slider-error"
  type="range"
  name="range-slider-error"
  min="0"
  max="100"
  step="10"
  value="20"
  aria-describedby="range-slider-error-error"
/>

<!-- Disabled -->
<label class="usa-label usx-label" for="range-slider-disabled">Range slider</label>
<input
  class="usa-range usx-range-slider"
  id="range-slider-disabled"
  type="range"
  name="range-slider-disabled"
  min="0"
  max="100"
  step="10"
  value="20"
  disabled
/>
