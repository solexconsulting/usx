{# Django template for Image #}
<figure class="
  usx-image
  {% if rounded %}
    usx-image--rounded
  {% endif %}
  {% if circular %}
    usx-image--circular
  {% endif %}
  {% if fit %}
    usx-image--fit
  {% endif %}
  {% if className %} {{ className }}{% endif %}"
  {% if maxWidth or maxHeight %}
    style="
      {% if maxWidth %}
        max-width: {{ maxWidth }};
        width: {{ maxWidth }};
        {% if not maxHeight %}
          height: auto;
        {% endif %}
      {% endif %}
      {% if maxHeight %}
        max-height: {{ maxHeight }};
        height: {{ maxHeight }};
        {% if not maxWidth %}
          width: auto;
        {% endif %}
      {% endif %}"
  {% endif %}>
  {% if src %}
  <img src="{{ src }}"{% if alt %} alt="{{ alt }}"{% endif %}>
  {% else %}
  Image
  {% endif %}
  {% if caption %}
  <figcaption class="usx-image--caption{% if hideCaption %} sr-only{% endif %}">{{ caption }}</figcaption>
  {% endif %}
</figure>
