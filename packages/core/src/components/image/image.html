<h3 class="site-preview-heading margin-bottom-0">Default</h3>
<div class="usx-image">
  <img src="https://picsum.photos/600/400?random=1" alt="Example image 1" />
</div>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">Rounded</h3>
<div class="usx-image usx-image--rounded">
  <img src="https://picsum.photos/600/400?random=2" alt="Example image 2" />
</div>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">Circular</h3>
<div class="usx-image usx-image--circular">
  <img src="https://picsum.photos/600/400?random=3" alt="Example image 3" />
</div>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">With Caption</h3>
<figure class="usx-image">
  <img src="https://picsum.photos/600/400?random=10" alt="Example image 10" />
  <figcaption class="usx-image--caption">This is a caption describing the image above.</figcaption>
</figure>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">Responsive (&lt;picture&gt;)</h3>
<div class="usx-image">
  <picture>
    <source media="(min-width: 64em)" srcset="/linear-w-symbol_left.svg" />
    <source media="(min-width: 40em)" srcset="/linear.svg" />
    <source media="(min-width: 20em)" srcset="/solex-only.svg" />
    <img src="/symbol-only.svg" alt="SOLEX" />
  </picture>
</div>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">Fit</h3>
<div class="usx-image usx-image--fit">
  <img src="https://picsum.photos/400/300?random=12" alt="Example image 12" />
</div>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">With Max Width</h3>
<figure class="usx-image usx-image--fit" style="max-width: 200px; height: auto;">
  <img src="https://picsum.photos/600/400?random=13" alt="Example image 13" style="max-width: 200px; height: auto;" />
  <figcaption class="usx-image--caption">This is a caption describing the image above.</figcaption>
</figure>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">With Max Height</h3>
<figure class="usx-image usx-image--fit" style="max-height: 150px; width: auto;">
  <img src="https://picsum.photos/600/400?random=14" alt="Example image 14" style="max-height: 150px; width: auto;" />
  <figcaption class="usx-image--caption">This is a caption describing the image above.</figcaption>
</figure>

<h3 class="site-preview-heading margin-top-7 margin-bottom-0">Long Caption</h3>
<figure class="usx-image">
  <img src="https://picsum.photos/600/400?random=15" alt="Example image 15" />
  <figcaption class="usx-image--caption">This is a longer caption that provides more detailed information about the image above. It can span multiple lines and gives context to the visual content.</figcaption>
</figure>
