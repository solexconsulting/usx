<!-- Plain (unenhanced) usa-character-count markup — relies on -->
<!-- @uswds/uswds/js/usa-character-count at runtime (call ONLY -->
<!-- characterCount.init(), never .on()/.off()) to move `maxlength` to -->
<!-- `data-maxlength`, hide the fallback message below, and manage the live -->
<!-- count/over-limit state itself. -->

<!-- Default -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-1">Text input</label>
    <input
      class="usa-input usx-input usa-character-count__field"
      id="cc-1"
      maxlength="25"
      aria-describedby="cc-1-info"
    />
  </div>
  <span id="cc-1-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>

<!-- WithHint -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-3">Text input with hint</label>
    <span id="cc-3-hint" class="usa-hint">You can enter up to 25 characters.</span>
    <input
      class="usa-input usx-input usa-character-count__field"
      id="cc-3"
      maxlength="25"
      aria-describedby="cc-3-info cc-3-hint"
    />
  </div>
  <span id="cc-3-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>

<!-- WithTextArea -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-4">Text area</label>
    <textarea
      class="usa-textarea usx-textarea usa-character-count__field"
      id="cc-4"
      maxlength="50"
      aria-describedby="cc-4-info"
    ></textarea>
  </div>
  <span id="cc-4-info" class="usa-character-count__message">You can enter up to 50 characters</span>
</div>

<!-- Required -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-6">
      <abbr title="required" class="usx-required">*</abbr>Required field
    </label>
    <input
      class="usa-input usx-input usa-character-count__field"
      id="cc-6"
      maxlength="25"
      aria-describedby="cc-6-info"
      required
    />
  </div>
  <span id="cc-6-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>

<!-- SuccessState -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-7">Success state</label>
    <input
      class="usa-input usx-input usa-character-count__field usa-input--success"
      id="cc-7"
      maxlength="25"
      aria-describedby="cc-7-info cc-7-success"
    />
    <span id="cc-7-success" class="usa-success-message" role="status">Looks good!</span>
  </div>
  <span id="cc-7-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>

<!-- Disabled -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-8">Disabled field</label>
    <input
      class="usa-input usx-input usa-character-count__field"
      id="cc-8"
      maxlength="25"
      aria-describedby="cc-8-info"
      disabled
    />
  </div>
  <span id="cc-8-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>

<!-- DefaultValueOverLimit -->
<div class="usa-character-count usx-character-count">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="cc-10">Pre-filled, already over the limit</label>
    <input
      class="usa-input usx-input usa-character-count__field"
      id="cc-10"
      maxlength="25"
      aria-describedby="cc-10-info"
      value="This default value is already way too long for the limit."
    />
  </div>
  <span id="cc-10-info" class="usa-character-count__message">You can enter up to 25 characters</span>
</div>
