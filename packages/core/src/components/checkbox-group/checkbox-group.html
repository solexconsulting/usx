<h3 class="site-preview-heading">Default</h3>
<fieldset class="usa-fieldset usa-checkbox-group usx-checkbox-group">
  <legend class="usa-legend">Select any that apply</legend>
  <div class="usa-checkbox usx-checkbox">
    <input class="usa-checkbox__input" id="historical-truth" type="checkbox" name="historical-figures" value="sojourner-truth" />
    <label class="usa-checkbox__label" for="historical-truth">Sojourner Truth</label>
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input class="usa-checkbox__input" id="historical-douglass" type="checkbox" name="historical-figures" value="frederick-douglass" checked />
    <label class="usa-checkbox__label" for="historical-douglass">Frederick Douglass</label>
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input class="usa-checkbox__input" id="historical-washington" type="checkbox" name="historical-figures" value="booker-t-washington" />
    <label class="usa-checkbox__label" for="historical-washington">Booker T. Washington</label>
  </div>
  <div class="usa-checkbox usx-checkbox">
    <input class="usa-checkbox__input" id="historical-carver" type="checkbox" name="historical-figures" value="george-washington-carver" disabled />
    <label class="usa-checkbox__label" for="historical-carver">George Washington Carver</label>
  </div>
</fieldset>

<h3 class="site-preview-heading">With Error</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <fieldset class="usa-fieldset usa-checkbox-group usx-checkbox-group">
    <legend class="usa-legend usa-label--error">Select any that apply</legend>
    <span class="usa-error-message" id="historical-figures-error-error" role="alert">Select at least one option.</span>
    <div class="usa-checkbox usx-checkbox">
      <input class="usa-checkbox__input" id="historical-error-truth" type="checkbox" name="historical-figures-error" value="sojourner-truth" />
      <label class="usa-checkbox__label" for="historical-error-truth">Sojourner Truth</label>
    </div>
    <div class="usa-checkbox usx-checkbox">
      <input class="usa-checkbox__input" id="historical-error-douglass" type="checkbox" name="historical-figures-error" value="frederick-douglass" />
      <label class="usa-checkbox__label" for="historical-error-douglass">Frederick Douglass</label>
    </div>
  </fieldset>
</div>
