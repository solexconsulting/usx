{# Django template for FileInput #}
<div class="usa-form-group usx-form-group{% if error %} usa-form-group--error{% endif %}">
  {% if label %}
  <label class="usa-label usx-label" for="{{ id }}">
    {% if required %}<abbr title="required" class="usx-required">*</abbr>{% endif %}{{ label }}
  </label>
  {% endif %}

  {% if hint %}
  <span class="usa-hint usx-hint" id="{{ id }}-hint">{{ hint }}</span>
  {% endif %}

  {% if error %}
  <span class="usa-error-message usx-error-message" id="{{ id }}-error" role="alert">{{ error }}</span>
  {% endif %}

  <input
    class="usa-file-input usx-file-input{% if className %} {{ className }}{% endif %}"
    id="{{ id }}"
    type="file"
    name="{{ name|default:id }}"
    {% if hint or error %} aria-describedby="{% if hint %}{{ id }}-hint{% endif %}{% if hint and error %} {% endif %}{% if error %}{{ id }}-error{% endif %}"{% endif %}
    {% if accept %} accept="{{ accept }}"{% endif %}
    {% if multiple %} multiple{% endif %}
    {% if invalidFileTypeMessage %} data-errormessage="{{ invalidFileTypeMessage }}"{% endif %}
    {% if disabled %} disabled{% endif %}
    {% if required %} required{% endif %}
  />
</div>
