<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <label id="react-appointment-date-label" class="usa-label usx-label" for="react-appointment-date"
    >Appointment date</label
  ><span class="usa-hint usx-hint" id="react-appointment-date-hint">mm/dd/yyyy</span>
  <div class="usa-date-picker usx-date-picker">
