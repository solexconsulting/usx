<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <label
    id="django-appointment-date-label"
    class="usa-label usx-label"
    for="django-appointment-date"
  >
    Appointment date
  </label>

  <span class="usa-hint usx-hint" id="django-appointment-date-hint">mm/dd/yyyy</span>

  <div class="usa-date-picker usx-date-picker">
    <input
      class="usa-input usx-input"
      id="django-appointment-date"
      name="appointment-date"
      aria-labelledby="django-appointment-date-label"
      aria-describedby="django-appointment-date-hint"
    />
  </div>
</div>
