{% load components %}

<svg
    class="
        usa-icon
        {% if size %}
          {% if size == 1 %}
            usx-icon--size-1
          {% else %}
             usa-icon--size-{{ size }}
          {% endif %}
        {% endif %}
        {% if className %}{{ className }}{% endif %}
        {% if color %}text-{{ color }}{% endif %}
    "
    {% if style %}style="{{ style }}"{% endif %}
    aria-hidden="true"
    focusable="false"
    role="img"
>
    {% if staticUrlPrefix %}
    <use href="{{ staticUrlPrefix }}{{ name }}"></use>
    {% elif source == 'usx' %}
    <use href="{% asset_url 'img/usx-sprite.svg' staticBaseUrl %}#{{ name }}"></use>
    {% else %}
    <use href="{% asset_url 'img/sprite.svg' staticBaseUrl %}#{{ name }}"></use>
    {% endif %}
</svg>
