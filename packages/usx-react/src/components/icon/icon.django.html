{% load static %}

<svg
    class="
        usa-icon
        {% if size %}
          {% if size == 1 %}
            usx-icon--size-1
          {% else %}
             usa-icon--size-{{ size }}
          {% endif %}
        {% endif %}
        {% if className %}{{ className }}{% endif %}
        {% if color %}text-{{ color }}{% endif %}
    "
    {% if style %}style="{{ style }}"{% endif %}
    aria-hidden="true"
    focusable="false"
    role="img"
>
    {% if source == 'usx' %}
    <use href="{% static 'img/usx-sprite.svg' %}#{{ name }}"></use>
    {% else %}
    <use href="{% static 'img/sprite.svg' %}#{{ name }}"></use>
    {% endif %}
</svg>
