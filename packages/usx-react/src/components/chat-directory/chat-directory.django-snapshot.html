<h3 class="site-preview-heading">Recipient Picker</h3>
<div>
  <section id="django-example-directory-recipientpicker" class="usx-chat" style="max-width: 28rem">
    <div data-chat-view="contacts" class="usx-chat__window" style="height: auto">
      <span class="usx-chat__copy-status usa-sr-only" role="status"></span>
      <div class="usx-chat__directory" role="group" aria-label="Recipients">
        <p class="usx-chat__recipient-hint">To: Choose one or more people.</p>

        <ul class="usx-chat__directory-list">
          <li>
            <div class="usa-checkbox usx-checkbox usx-chat__directory-item usx-chat__recipient">
              <input
                id="django-directory-recipients-recipient-agent"
                class="usa-checkbox__input"
                type="checkbox"
                name="recipientIds"
                value="agent"
                form="django-example-directory-recipientpicker-composer"
                checked
                aria-label="Morgan"
                aria-describedby="django-directory-recipients-recipient-agent-description"
                data-usx-chat-recipient=""
              />
              <label
                class="usa-checkbox__label usx-chat__recipient-label"
                for="django-directory-recipients-recipient-agent"
              >
                <span class="usx-avatar usx-chat__avatar" aria-label="Morgan">
                  <span class="usx-avatar__content usx-circle bg-primary-light text-inverse"
                    >M</span
                  >
                </span>

                <span class="usx-chat__directory-copy">
                  <span class="usx-chat__directory-title">Morgan</span>
                  <span
                    class="usx-chat__directory-subtitle"
                    id="django-directory-recipients-recipient-agent-description"
                    >Application support</span
                  >
                </span>
              </label>
            </div>
          </li>

          <li>
            <div class="usa-checkbox usx-checkbox usx-chat__directory-item usx-chat__recipient">
              <input
                id="django-directory-recipients-recipient-specialist"
                class="usa-checkbox__input"
                type="checkbox"
                name="recipientIds"
                value="specialist"
                form="django-example-directory-recipientpicker-composer"
                aria-label="Taylor"
                aria-describedby="django-directory-recipients-recipient-specialist-description"
                data-usx-chat-recipient=""
              />
              <label
                class="usa-checkbox__label usx-chat__recipient-label"
                for="django-directory-recipients-recipient-specialist"
              >
                <span class="usx-avatar usx-chat__avatar" aria-label="Taylor">
                  <span class="usx-avatar__content usx-circle bg-primary-light text-inverse"
                    >T</span
                  >
                </span>

                <span class="usx-chat__directory-copy">
                  <span class="usx-chat__directory-title">Taylor</span>
                  <span
                    class="usx-chat__directory-subtitle"
                    id="django-directory-recipients-recipient-specialist-description"
                    >Eligibility specialist</span
                  >
                </span>
              </label>
            </div>
          </li>
        </ul>
      </div>
      <form
        id="django-example-directory-recipientpicker-composer"
        data-usx-chat-require-recipients="true"
        class="usx-chat-composer usx-chat__composer"
        method="post"
      >
        <label
          class="usa-label usx-label usa-sr-only"
          for="django-example-directory-recipientpicker-message"
          >Message</label
        ><textarea
          id="django-example-directory-recipientpicker-message"
          class="usa-textarea usx-textarea"
          placeholder="Write a message"
          name="message"
          rows="2"
        ></textarea>
        <div class="usx-chat__composer-actions">
          <div class="usx-chat__attach"></div>
          <button
            type="submit"
            class="usa-button usx-button usa-button--primary usx-chat__send"
            disabled=""
            aria-disabled="true"
          >
            <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
              <use href="/img/sprite.svg#send"></use></svg
            >Send
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
