<h3 class="site-preview-heading">Default</h3>
<div class="usx-theme-picker">
  <button
    type="button"
    class="usa-button usx-button usx-button--ghost usx-theme-picker__trigger"
    aria-label="Theme"
    aria-expanded="false"
    aria-controls="theme-picker-example-1-panel"
  >
    <svg
      class="usa-icon usx-icon usx-theme-picker__icon"
      aria-hidden="true"
      focusable="false"
      role="img"
    >
      <use href="./img/usx-sprite.svg#color_palette"></use>
    </svg>
  </button>
  <div id="theme-picker-example-1-panel" class="usx-theme-picker__panel">
    <label class="usa-label usx-label usa-sr-only" for="theme-picker-example-1">Theme</label
    ><select id="theme-picker-example-1" class="usa-select usx-select">
      <option value="Default" selected="">Default</option>
      <option value="Forest">Forest</option>
      <option value="Sunset">Sunset</option>
      <option value="Ocean">Ocean</option>
      <option value="Aurora">Aurora</option>
      <option value="Borealis">Borealis</option>
      <option value="Midnight">Midnight</option>
      <option value="Carbon">Carbon</option>
      <option value="VADS">VADS</option>
      <option value="GOV.UK">GOV.UK</option>
      <option value="NASA">NASA</option></select
    ><button
      type="button"
      class="usa-button usx-button usa-button--primary usx-theme-picker__toggle"
      aria-label="Confirm theme"
    >
      <svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/img/sprite.svg#close"></use>
      </svg>
    </button>
  </div>
</div>


<h3 class="site-preview-heading">Ghost Select</h3>
<div class="usx-theme-picker usx-theme-picker--ghost-select">
  <div class="usx-theme-picker__ghost">
    <span
      class="usa-button usx-button usx-button--ghost usx-theme-picker__ghost-face"
      aria-hidden="true"
      ><svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="./img/usx-sprite.svg#color_palette"></use></svg></span
    ><label class="usa-label usx-label usa-sr-only" for="theme-picker-example-ghost-select"
      >Theme</label
    ><select
      id="theme-picker-example-ghost-select"
      class="usa-select usx-select usx-theme-picker__select--hidden"
    >
      <option value="Default" selected="">Default</option>
      <option value="Forest">Forest</option>
      <option value="Sunset">Sunset</option>
      <option value="Ocean">Ocean</option>
      <option value="Aurora">Aurora</option>
      <option value="Borealis">Borealis</option>
      <option value="Midnight">Midnight</option>
      <option value="Carbon">Carbon</option>
      <option value="VADS">VADS</option>
      <option value="GOV.UK">GOV.UK</option>
      <option value="NASA">NASA</option>
    </select>
  </div>
</div>


<h3 class="site-preview-heading">Swap</h3>
<div class="usx-theme-picker usx-theme-picker--swap">
  <label
    class="usx-swap usx-swap--rotate usx-theme-picker__swap usa-button usx-button usx-button--ghost"
    ><input type="checkbox" autocomplete="off" aria-label="Theme: Light. Switch to Dark" /><span
      class="usx-swap-on"
      ><svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="./img/usx-sprite.svg#moon"></use></svg></span
    ><span class="usx-swap-off"
      ><svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="./img/usx-sprite.svg#sun"></use></svg></span
  ></label>
  <div class="usx-theme-picker__fallback">
    <label class="usa-label usx-label usa-sr-only" for="theme-picker-example-swap">Theme</label
    ><select id="theme-picker-example-swap" class="usa-select usx-select">
      <option value="Aurora" selected="">Light</option>
      <option value="Borealis">Dark</option>
    </select>
  </div>
</div>
