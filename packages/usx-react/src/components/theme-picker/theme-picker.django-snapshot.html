<h3 class="site-preview-heading">Default</h3>
<div class="usx-theme-picker" hidden>
  <button
    type="button"
    class="usa-button usx-button usx-button--ghost usx-theme-picker__trigger"
    aria-label="Theme"
    aria-expanded="false"
    aria-controls="django-theme-picker-1-panel"
  >
    <svg
      class="usa-icon usx-icon usx-theme-picker__icon"
      aria-hidden="true"
      focusable="false"
      role="img"
    >
      <use href="img/usx-sprite.svg#color_palette"></use>
    </svg>
  </button>
  <div id="django-theme-picker-1-panel" class="usx-theme-picker__panel">
    <label class="usa-label usx-label usa-sr-only" for="django-theme-picker-1"> Theme </label>

    <select id="django-theme-picker-1" class="usa-select usx-select">
      <option value="default" selected>Default</option>

      <option value="forest">Forest</option>

      <option value="sunset">Sunset</option>

      <option value="ocean">Ocean</option>

      <option value="aurora">Aurora</option>

      <option value="borealis">Borealis</option>

      <option value="midnight">Midnight</option>

      <option value="carbon">Carbon</option>

      <option value="vads">VADS</option>

      <option value="gov-uk">GOV.UK</option>

      <option value="nasa">NASA</option>
    </select>

    <button
      type="button"
      class="usa-button usx-button usa-button--primary usx-theme-picker__toggle"
      aria-label="Confirm theme"
    >
      <svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="img/sprite.svg#close"></use>
      </svg>
    </button>
  </div>
</div>

<h3 class="site-preview-heading">Swap</h3>
<div class="usx-theme-picker usx-theme-picker--swap" hidden>
  <button
    type="button"
    class="usx-swap usx-swap--rotate usa-button usx-button usx-swap--button usx-theme-picker__swap usx-button--ghost usx-button--tight"
    aria-pressed="false"
    aria-label="Dark Theme"
    data-usx-theme-off="aurora"
    data-usx-theme-on="borealis"
  >
    <span class="usx-swap-on">
      <svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="img/usx-sprite.svg#moon"></use></svg
    ></span>
    <span class="usx-swap-off">
      <svg
        class="usa-icon usx-icon usx-theme-picker__icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="img/usx-sprite.svg#sun"></use></svg
    ></span>
  </button>
  <input id="django-theme-picker-swap" type="hidden" value="aurora" />
</div>
