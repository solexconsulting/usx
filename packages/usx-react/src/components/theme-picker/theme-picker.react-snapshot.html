<h3 class="site-preview-heading">Default</h3>
<div class="usx-theme-picker" hidden="">
  <button
    type="button"
    class="usa-button usx-button usx-button--ghost usx-theme-picker__trigger"
    aria-label="Theme"
    aria-expanded="false"
    aria-controls="react-theme-picker-1-panel"
  >
    <svg
      class="usa-icon usx-icon usx-theme-picker__icon"
      aria-hidden="true"
      focusable="false"
      role="img"
    >
      <use href="/img/usx-sprite.svg#color_palette"></use>
    </svg>
  </button>
  <div id="react-theme-picker-1-panel" class="usx-theme-picker__panel">
    <label class="usa-label usx-label usa-sr-only" for="react-theme-picker-1">Theme</label

      <option value="default" selected="">Default</option>
      <option value="forest">Forest</option>
      <option value="sunset">Sunset</option>
      <option value="ocean">Ocean</option>
      <option value="aurora">Aurora</option>
      <option value="borealis">Borealis</option>
      <option value="midnight">Midnight</option>
      <option value="carbon">Carbon</option>
      <option value="vads">VADS</option>
      <option value="gov-uk">GOV.UK</option>
      <option value="nasa">NASA</option></select

      type="button"
      class="usa-button usx-button usa-button--primary usx-theme-picker__toggle"
      aria-label="Confirm theme"

      <svg

        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/img/sprite.svg#close"></use>
      </svg>
    </button>
  </div>
</div>

    aria-label="Dark Theme"
    data-usx-theme-off="aurora"
    data-usx-theme-on="borealis"
  >

    ></span></button
  ><input id="react-theme-picker-swap" type="hidden" value="aurora" />
