<div class="usx-chat__message-tools" role="group" aria-label="Actions for message from Avery">
  <details class="usx-popover usx-chat__message-actions usx-chat__reaction-actions" data-side="top" data-align="end">
    <summary class="usa-button usx-button usa-button--unstyled" aria-label="React to message from Avery" title="Add reaction">
      <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
        <use href="/img/sprite.svg#sentiment_satisfied"></use>
      </svg>
    </summary>
    <div id="react-tools-default-reactions-m1" class="usx-popover__panel usx-popover__panel--square">
      <ul class="usx-popover__menu">
        <li>
          <button aria-label="Helpful" title="Helpful" aria-pressed="true" data-usx-chat-reaction="Helpful" type="button" class="usx-popover__menu-item">
            👍
          </button>
        </li>
        <li>
          <button aria-label="Thanks" title="Thanks" aria-pressed="false" data-usx-chat-reaction="Thanks" type="button" class="usx-popover__menu-item">
            ❤️
          </button>
        </li>
      </ul>
    </div>
  </details>
  <button type="button" class="usa-button usx-button usa-button--unstyled usx-chat__tool-button" title="Reply in thread" aria-label="Reply in thread to message from Avery" data-usx-chat-thread="m1">
    <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
      <use href="/img/sprite.svg#comment"></use>
    </svg></button><button type="button" class="usa-button usx-button usa-button--unstyled usx-chat__tool-button" title="Forward message" aria-label="Forward message from Avery" data-usx-chat-forward="m1">
    <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
      <use href="/img/sprite.svg#arrow_forward"></use>
    </svg>
  </button>
  <details class="usx-popover usx-chat__message-actions usx-chat__overflow-actions" data-side="top" data-align="end">
    <summary class="usa-button usx-button usa-button--unstyled" aria-label="More actions for message from Avery" title="More actions">
      <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
        <use href="/img/sprite.svg#more_horiz"></use>
      </svg>
    </summary>
    <div id="react-tools-default-actions-m1" class="usx-popover__panel usx-popover__panel--square">
      <ul class="usx-popover__menu">
        <li>
          <button data-usx-chat-copy-message="" type="button" class="usx-popover__menu-item">
            <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
              <use href="/img/sprite.svg#content_copy"></use></svg>Copy message
          </button>
        </li>
        <li>
          <button data-usx-chat-message-action="report" type="button" class="usx-popover__menu-item">
            Report message
          </button>
        </li>
      </ul>
    </div>
  </details>
</div>
