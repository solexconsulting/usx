<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="react-form-group-default-input">Form group label</label
    ><input
      id="react-form-group-default-input"
      class="usa-input usx-input"
      placeholder="Type here"
    />
  </div>
</div>

<h3 class="site-preview-heading">Error State</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <div class="usa-form-group usx-form-group usa-form-group--error">
    <label class="usa-label usx-label usa-label--error" for="react-form-group-error-input"
      >Error state</label
    ><span
      class="usa-error-message usx-error-message"
      role="alert"
      id="react-form-group-error-input-error"
      >This field is required.</span
    ><input
      id="react-form-group-error-input"
      class="usa-input usx-input usa-input--error"
      placeholder="Type here"
      aria-describedby="react-form-group-error-input-error"
      aria-invalid="true"
    />
  </div>
</div>

<h3 class="site-preview-heading">Success State</h3>
<div class="usa-form-group usx-form-group">
  <div class="usa-form-group usx-form-group">
    <label class="usa-label usx-label" for="react-form-group-success-input">Success state</label
    ><input
      id="react-form-group-success-input"
      class="usa-input usx-input usa-input--success"
      placeholder="Type here"
    />
  </div>
</div>
