<div class="usx-data-table-shell" data-usx-data-table data-searchable data-paginate data-page-size="2">

        <tr class="usx-data-table__row"><td class="usx-data-table__cell usx-data-table__cell--selection usx-data-table__cell--valign-middle"><div class="usa-checkbox usx-checkbox usx-checkbox--small"><input class="usa-checkbox__input" id="admissions-select-arizona" type="checkbox" aria-label="Select Arizona" name="admissions-selection" value="arizona"><label class="usa-checkbox__label" for="admissions-select-arizona"></label></div></td><th scope="row" data-column-key="name">Arizona</th><td data-column-key="order" data-sort-value="48">48</td><td data-column-key="region">Southwest</td></tr>

    </table>
  </div>
  <div class="usx-pagination usx-data-table__pagination"><div class="usx-pagination__container">
