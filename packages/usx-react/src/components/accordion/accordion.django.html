<div
    id="{{ id }}"
    class="usa-accordion usx-accordion {% if bordered %}usa-accordion--bordered{% endif %} {{ className }}"
    {% if multiselectable %}
    data-allow-multiple="true"
    {% endif %}
>
{% for item in items %}
    {% if headingLevel == 'h1' %}
        <h1 id="{{ id }}-{{ forloop.counter0 }}-heading" class="usa-accordion__heading {{ className }}">
    {% elif headingLevel == 'h2' %}
        <h2 id="{{ id }}-{{ forloop.counter0 }}-heading" class="usa-accordion__heading {{ className }}">
    {% elif headingLevel == 'h4' %}
        <h4 id="{{ id }}-{{ forloop.counter0 }}-heading" class="usa-accordion__heading {{ className }}">
    {% else %}
        <h3 id="{{ id }}-{{ forloop.counter0 }}-heading" class="usa-accordion__heading {{ className }}">
    {% endif %}
        <button
            class="usa-accordion__button"
            aria-expanded="false"
            aria-controls="{{ id }}-{{ forloop.counter0 }}-content"
            type="button"
        >
            {{ item.title }}
        </button>
    {% if headingLevel == 'h1' %}
        </h1>
    {% elif headingLevel == 'h2' %}
        </h2>
    {% elif headingLevel == 'h4' %}
        </h4>
    {% else %}
        </h3>
    {% endif %}

    <div
        id="{{ id }}-{{ forloop.counter0 }}-content"
        class="usa-accordion__content"
        aria-labelledby="{{ id }}-{{ forloop.counter0 }}-heading"
        hidden
    >
        {{ item.content }}
    </div>

{% endfor %}

</div>
