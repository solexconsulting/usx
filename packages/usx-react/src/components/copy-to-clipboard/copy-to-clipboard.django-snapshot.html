<h3 class="site-preview-heading">Default</h3>
<span class="usx-tooltip">
  <button
    type="button"
    class="usa-button usx-button usx-button--ghost usx-copy"
    onclick="navigator.clipboard.writeText('Example text to copy')"
  >
    <svg class="usa-icon usx-copy__copy" aria-hidden="true" focusable="false" role="img">
      <use href="img/sprite.svg#content_copy"></use>
    </svg>

    <svg class="usa-icon usx-copy__check" aria-hidden="true" focusable="false" role="img">
      <use href="img/sprite.svg#check"></use>
    </svg>
  </button>

  <span class="usa-tooltip__body usa-tooltip__body--top" role="tooltip"
    ><span class="usx-copy__tooltip--copy">Copy to clipboard</span
    ><span class="usx-copy__tooltip--copied">Copied</span></span
  >
</span>

<h3 class="site-preview-heading">With Text</h3>
<button

>

    <use href="img/sprite.svg#check"></use>
  </svg>
  <span class="margin-left-1">Copy</span>
</button>
