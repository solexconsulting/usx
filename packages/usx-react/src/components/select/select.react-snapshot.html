<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-select-default">Dropdown label</label
  ><select id="react-select-default" class="usa-select usx-select">
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>

<h3 class="site-preview-heading">Error State</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="react-select-error">Dropdown label</label
  ><span class="usa-hint usx-hint" id="react-select-error-hint"
    >This is a select with an error message.</span
  ><span class="usa-error-message usx-error-message" role="alert" id="react-select-error-error"
    >Selection error message</span
  ><select
    id="react-select-error"
    class="usa-select usx-select usa-input--error"
    aria-describedby="react-select-error-hint react-select-error-error"
    aria-invalid="true"
  >
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>

<h3 class="site-preview-heading">Success State</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-select-success">Success state select</label
  ><select id="react-select-success" class="usa-select usx-select usa-input--success">
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option></select
  ><span class="usa-success-message">Success message goes here.</span>
</div>

<h3 class="site-preview-heading">Disabled</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-select-disabled">Disabled select</label
  ><select id="react-select-disabled" class="usa-select usx-select" disabled="">
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>

<h3 class="site-preview-heading">Disabled With Error</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="react-select-disabled-error"
    >Disabled with error</label
  ><span
    class="usa-error-message usx-error-message"
    role="alert"
    id="react-select-disabled-error-error"
    >This field is disabled due to an error.</span
  ><select
    id="react-select-disabled-error"
    class="usa-select usx-select usa-input--error"
    disabled=""
    aria-describedby="react-select-disabled-error-error"
    aria-invalid="true"
  >
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>

<h3 class="site-preview-heading">Default Value</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-select-default-value"
    >Select with default value</label
  ><select id="react-select-default-value" class="usa-select usx-select">
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2" selected="">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>

<h3 class="site-preview-heading">With Hint</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-select-with-hint">Select with hint</label
  ><span class="usa-hint usx-hint" id="react-select-with-hint-hint"
    >This is a helpful hint for the select.</span
  ><select
    id="react-select-with-hint"
    class="usa-select usx-select"
    aria-describedby="react-select-with-hint-hint"
  >
    <option value="">Select an option</option>
    <option value="option1">Option A</option>
    <option value="option2">Option B</option>
    <option value="option3">Option C</option>
  </select>
</div>
