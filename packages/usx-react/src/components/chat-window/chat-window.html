<details class="usx-popover usx-chat" open="" data-side="bottom" data-align="start" data-usx-popover-dismiss-on-outside="false">
  <summary>Open chat</summary>
  <div id="react-window-default" class="usx-popover__panel usx-popover__panel--square usx-chat__panel">
    <header class="usx-popover__header usx-chat__header">
      <div class="usx-popover__header-content">
        <h2 id="react-window-default-title" class="usx-popover__panel-heading" tabindex="-1">
          Support
        </h2>
      </div>
      <div class="usx-popover__header-right-actions">
        <button type="button" class="usa-button usx-button usa-button--unstyled usx-popover__header-action usx-popover__header-close" aria-label="Close chat" data-usx-popover-close="react-window-default">
          <svg class="usa-icon usx-icon" aria-hidden="true" focusable="false" role="img">
            <use href="/img/sprite.svg#close"></use>
          </svg>
        </button>
      </div>
    </header>
    <div class="usx-popover__panel-content usx-chat__popover-content">
      <section class="usx-chat__window" aria-labelledby="react-window-default-title" data-chat-view="conversation">
        <span class="usx-chat__copy-status usa-sr-only" role="status" aria-live="polite"></span>
        <p class="usx-chat__status">Usually replies within a day.</p>
        Conversation content goes here.
      </section>
    </div>
  </div>
</details>
