<h3 class="site-preview-heading">Default</h3>
<label class="usx-swap"
  ><input type="checkbox" autocomplete="off" /><span class="usx-swap-on">ON</span
  ><span class="usx-swap-off">OFF</span></label
>

<h3 class="site-preview-heading margin-top-5">Default Icon</h3>
<label class="usx-swap"
  ><input type="checkbox" autocomplete="off" /><span class="usx-swap-on"
    ><svg
      class="usa-icon usa-icon--size-4"
      aria-hidden="true"
      aria-label="visibility icon"
      focusable="false"
      role="img"
    >
      <use href="/img/sprite.svg#visibility"></use></svg></span
  ><span class="usx-swap-off"
    ><svg
      class="usa-icon usa-icon--size-4"
      aria-hidden="true"
      aria-label="info icon"
      focusable="false"
      role="img"
    >
      <use href="/img/sprite.svg#info"></use></svg></span
></label>

<h3 class="site-preview-heading margin-top-5">Active (fixed state)</h3>
<label class="usx-swap usx-swap--active usx-swap-active"
  ><span class="usx-swap-on">ACTIVE</span><span class="usx-swap-off">INACTIVE</span></label
>

<h3 class="site-preview-heading margin-top-5">Rotate Text</h3>
