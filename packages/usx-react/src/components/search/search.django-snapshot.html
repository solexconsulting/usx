<h3 class="site-preview-heading">Default</h3>
<section aria-label="Search">
  <form
    id="django-search-default-form"
    class="usa-search"
    method="get"
    role="search"
    onsubmit="handleSubmit"
  >
    <label class="usa-label usx-label usa-sr-only" for="django-search-default"> Search </label>

    <input
      id="django-search-default"
      class="usa-input usx-input"
      placeholder=""
      value=""
      type="search"
      name="q"
    />

    <button type="submit" class="usa-button usx-button usa-button--primary">
      <span class="usa-search__submit-text">Search</span>

      <svg class="usa-icon usa-search__submit-icon" aria-hidden="true" focusable="false" role="img">
        <use href="img/sprite.svg#search"></use>
      </svg>
    </button>
  </form>
  <script data-id="search-default" data-on-submit="" data-search-key="q">
    const data = document.currentScript.dataset;
    const onSubmit = data.onSubmit;

    if (!!onSubmit) {
      const id = data.id;
      const searchKey = data.searchKey;
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById(`${id}-form`).onsubmit = function (e) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const query = formData.get(searchKey);
          const func = eval(onSubmit);
          func(query);
          return false;
        };
      });
    }
  </script>
</section>
