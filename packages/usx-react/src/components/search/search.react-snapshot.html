<h3 class="site-preview-heading">Default</h3>
<section aria-label="Search">
  <form id="react-search-default-form" class="usa-search" method="get" role="search">
    <label class="usa-label usx-label usa-sr-only" for="react-search-default">Search</label
    ><input
      id="react-search-default"
      class="usa-input usx-input"
      placeholder=""
      type="search"
      name="q"
    /><button type="submit" class="usa-button usx-button usa-button--primary">
      <span class="usa-search__submit-text">Search</span
      ><svg
        class="usa-icon usa-search__submit-icon"
        aria-hidden="true"
        focusable="false"
        role="img"
      >
        <use href="/img/sprite.svg#search"></use>
      </svg>
    </button>
  </form>
</section>
