{% load usx_components %}
<!-- prettier-ignore -->
<div class="usx-drawer{% if className %} {{ className }}{% endif %}"{% if extraAttributes %}{% for attr, value in extraAttributes.items %} {{ attr }}="{% if value is True %}true{% elif value is False %}false{% else %}{{ value }}{% endif %}"{% endfor %}{% endif %}>
  <button
    type="button"
    {% if triggerClassName %}class="{{ triggerClassName|force_escape }}"
    {% endif %}
    aria-haspopup="dialog"
    aria-controls="{{ id|force_escape }}"{% if triggerAriaLabel %}
    aria-label="{{ triggerAriaLabel|force_escape }}"{% endif %}{% if disabled %}
    disabled{% endif %}
    commandfor="{{ id|force_escape }}"
    command="show-modal"
  >{% if trigger != None %}{{ trigger|safe }}{% else %}{{ label|force_escape }}{% endif %}</button>
  <dialog
    id="{{ id|force_escape }}"
    class="usx-drawer__panel{% if rounded %} usx-drawer__panel--rounded{% endif %}{% if panelClassName %} {{ panelClassName }}{% endif %}"
    data-side="{{ side|default:'inline-end'|force_escape }}"
    data-size="{{ size|default:'default'|force_escape }}"{% if actionRequired %}
    closedby="none"{% endif %}
    aria-labelledby="{{ id|force_escape }}-heading"{% if description %}
    aria-describedby="{{ id|force_escape }}-description"{% endif %}
  >{% if not actionRequired %}
    <button type="button" class="usx-drawer__close" commandfor="{{ id|force_escape }}" command="close">
      {% icon name='close' size=3 alt=closeLabel|default:'Close' %}{% endicon %}
    </button>{% endif %}
    <header class="usx-drawer__header">
      <h2 id="{{ id|force_escape }}-heading" class="usx-drawer__heading"{% if focusHeading != False %} tabindex="-1" autofocus{% endif %}>{{ heading|force_escape }}</h2>{% if description %}
      <p id="{{ id|force_escape }}-description" class="usx-drawer__description">{{ description|force_escape }}</p>{% endif %}
    </header>
    <div class="usx-drawer__body">{{ children|safe }}</div>{% if footer %}
    <footer class="usx-drawer__footer">{{ footer|safe }}</footer>{% endif %}
  </dialog>
</div>
