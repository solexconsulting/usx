{% load static %}
{# Django template for Spinner #}
<span role="status" aria-live="polite" class="usx-spinner{% if className %} {{ className }}{% endif %}">
  <svg class="usa-icon {% if size == 1 %}usx-spinner--size-1{% else %}usa-icon--size-{{ size|default:3 }}{% endif %}{% if color %} text-{{ color }}{% endif %}" aria-hidden="true" focusable="false">
    <use href="{% static 'img/usx-sprite.svg' %}#spinner"></use>
  </svg>
  {% if screenReaderLabel %}<span class="usa-sr-only">{{ screenReaderLabel }}</span>{% endif %}
  {% if label %}<span class="usa-label usx-label">{{ label }}</span>{% endif %}
</span>
