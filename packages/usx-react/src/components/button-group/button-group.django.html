{% load components %}
{# Django template for ButtonGroup #}
<ul class="usa-button-group usx-button-group {% if segmented %}usa-button-group--segmented{% endif %} {{ className }}">
  {% for item in buttonProps %}
    <li class="usa-button-group__item{% if item.itemClassName %} {{ item.itemClassName }}{% endif %}">
      {% button props=item %}{{ item.children|safe }}{% endbutton %}
    </li>
  {% endfor %}
</ul>
