<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-default"> Text area label </label>

  <textarea
    class="usa-textarea usx-textarea"
    id="django-text-area-default"
    placeholder="Type here"
  ></textarea>
</div>

<h3 class="site-preview-heading">With Hint</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-with-hint"> Text area with hint </label>

  <span class="usa-hint usx-hint" id="django-text-area-with-hint-hint"
    >Enter a detailed description.</span
  >

  <textarea
    class="usa-textarea usx-textarea"
    id="django-text-area-with-hint"
    placeholder=""
    aria-describedby="django-text-area-with-hint-hint"
  ></textarea>
</div>

<h3 class="site-preview-heading">Required</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-required">
    <abbr title="Required" class="usx-required">*</abbr> Required text area
  </label>

  <textarea
    class="usa-textarea usx-textarea"
    id="django-text-area-required"
    placeholder=""
    required
  ></textarea>
</div>

<h3 class="site-preview-heading">Screen Reader Only Label</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label usa-sr-only" for="django-text-area-screen-reader-only-label">
    Visually hidden label
  </label>

  <textarea
    class="usa-textarea usx-textarea"
    id="django-text-area-screen-reader-only-label"
    placeholder="Enter your message…"
  ></textarea>
</div>

<h3 class="site-preview-heading">Error State</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="django-text-area-error-state">
    Error state text area
  </label>

  <span
    class="usa-error-message usx-error-message"
    id="django-text-area-error-state-error"
    role="alert"
    >Enter at least 10 characters.</span
  >

  <textarea
    class="usa-textarea usx-textarea usa-input--error"
    id="django-text-area-error-state"
    placeholder=""
    aria-describedby="django-text-area-error-state-error"
    aria-invalid="true"
  ></textarea>
</div>

<h3 class="site-preview-heading">Error State No Message</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="django-text-area-error-state-no-message">
    Error state (no message)
  </label>

  <textarea
    class="usa-textarea usx-textarea usa-input--error"
    id="django-text-area-error-state-no-message"
    placeholder=""
    aria-invalid="true"
  ></textarea>
</div>

<h3 class="site-preview-heading">Success State</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-success-state">
    Success state text area
  </label>

  <textarea
    class="usa-textarea usx-textarea usa-input--success"
    id="django-text-area-success-state"
    placeholder=""
  ></textarea>
</div>

<h3 class="site-preview-heading">Success State No Message</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-success-state-no-message">
    Success state (no message)
  </label>

  <textarea
    class="usa-textarea usx-textarea usa-input--success"
    id="django-text-area-success-state-no-message"
    placeholder=""
  ></textarea>
</div>

<h3 class="site-preview-heading">Disabled</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="django-text-area-disabled"> Disabled text area </label>

  <textarea
    class="usa-textarea usx-textarea"
    id="django-text-area-disabled"
    placeholder=""
    disabled
  ></textarea>
</div>
