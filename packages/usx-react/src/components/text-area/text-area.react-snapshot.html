<h3 class="site-preview-heading">Default</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-default">Text area label</label
  ><textarea
    id="react-text-area-default"
    class="usa-textarea usx-textarea"
    placeholder="Type here"
  ></textarea>
</div>

<h3 class="site-preview-heading">With Hint</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-with-hint">Text area with hint</label
  ><span class="usa-hint usx-hint" id="react-text-area-with-hint-hint"
    >Enter a detailed description.</span
  ><textarea
    id="react-text-area-with-hint"
    class="usa-textarea usx-textarea"
    placeholder=""
    aria-describedby="react-text-area-with-hint-hint"
  ></textarea>
</div>

<h3 class="site-preview-heading">Required</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-required"
    ><abbr title="Required" class="usx-required">*</abbr> Required text area</label
  ><textarea
    id="react-text-area-required"
    class="usa-textarea usx-textarea"
    placeholder=""
    required=""
  ></textarea>
</div>

<h3 class="site-preview-heading">Screen Reader Only Label</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label usa-sr-only" for="react-text-area-screen-reader-only-label"
    >Visually hidden label</label
  ><textarea
    id="react-text-area-screen-reader-only-label"
    class="usa-textarea usx-textarea"
    placeholder="Enter your message…"
  ></textarea>
</div>

<h3 class="site-preview-heading">Error State</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="react-text-area-error-state"
    >Error state text area</label
  ><span
    class="usa-error-message usx-error-message"
    role="alert"
    id="react-text-area-error-state-error"
    >Enter at least 10 characters.</span
  ><textarea
    id="react-text-area-error-state"
    class="usa-textarea usx-textarea usa-input--error"
    placeholder=""
    aria-describedby="react-text-area-error-state-error"
    aria-invalid="true"
  ></textarea>
</div>

<h3 class="site-preview-heading">Error State No Message</h3>
<div class="usa-form-group usx-form-group usa-form-group--error">
  <label class="usa-label usx-label usa-label--error" for="react-text-area-error-state-no-message"
    >Error state (no message)</label
  ><textarea
    id="react-text-area-error-state-no-message"
    class="usa-textarea usx-textarea usa-input--error"
    placeholder=""
    aria-invalid="true"
  ></textarea>
</div>

<h3 class="site-preview-heading">Success State</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-success-state"
    >Success state text area</label
  ><textarea
    id="react-text-area-success-state"
    class="usa-textarea usx-textarea usa-input--success"
    placeholder=""
  ></textarea>
</div>

<h3 class="site-preview-heading">Success State No Message</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-success-state-no-message"
    >Success state (no message)</label
  ><textarea
    id="react-text-area-success-state-no-message"
    class="usa-textarea usx-textarea usa-input--success"
    placeholder=""
  ></textarea>
</div>

<h3 class="site-preview-heading">Disabled</h3>
<div class="usa-form-group usx-form-group">
  <label class="usa-label usx-label" for="react-text-area-disabled">Disabled text area</label
  ><textarea
    id="react-text-area-disabled"
    class="usa-textarea usx-textarea"
    placeholder=""
    disabled=""
  ></textarea>
</div>
