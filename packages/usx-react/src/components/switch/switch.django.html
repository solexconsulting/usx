{# Django template for Switch #}
{% if label %}
<label class="usa-label usx-switch__label">
  <input
    type="checkbox"
    class="usx-switch usx-toggle-{{ size|default:"md" }}{% if variant %} text-{{ variant }}{% endif %}{% if className %} {{ className }}{% endif %}"
    {% if id %}id="{{ id }}"{% endif %}
    {% if name %}name="{{ name }}"{% endif %}
    {% if checked %}checked{% endif %}
    {% if defaultChecked %}checked{% endif %}
    {% if indeterminate %}aria-checked="mixed"{% elif ariaChecked is not none %}aria-checked="{{ ariaChecked }}"{% endif %}
    {% if disabled %}disabled{% endif %}
  />
  {{ label }}
</label>
{% else %}
<input
  type="checkbox"
  class="usx-switch usx-toggle-{{ size|default:"md" }}{% if variant %} text-{{ variant }}{% endif %}{% if className %} {{ className }}{% endif %}"
  {% if id %}id="{{ id }}"{% endif %}
  {% if name %}name="{{ name }}"{% endif %}
  {% if checked %}checked{% endif %}
  {% if defaultChecked %}checked{% endif %}
  {% if indeterminate %}aria-checked="mixed"{% elif ariaChecked is not none %}aria-checked="{{ ariaChecked }}"{% endif %}
  {% if disabled %}disabled{% endif %}
/>{% endif %}
