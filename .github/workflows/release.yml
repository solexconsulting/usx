name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) requires npm >=11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-django:
    name: Build Django release
    needs: release
    if: needs.release.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.pypi.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check whether this Django version needs publishing
        id: pypi
        run: python scripts/check-django-release.py

      - uses: pnpm/action-setup@v5
        if: steps.pypi.outputs.publish == 'true'

      - uses: actions/setup-node@v5
        if: steps.pypi.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build and test Python distributions
        if: steps.pypi.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          python -m pip install build
          pnpm generate:django
          python -m build packages/usx-django
          python -m venv "$RUNNER_TEMP/usx-wheel-test"
          "$RUNNER_TEMP/usx-wheel-test/bin/pip" install packages/usx-django/dist/*.whl
          "$RUNNER_TEMP/usx-wheel-test/bin/python" -I packages/usx-django/tests/test_installed.py

      - uses: actions/upload-artifact@v6
        if: steps.pypi.outputs.publish == 'true'
        with:
          name: django-distributions
          path: packages/usx-django/dist/*
          if-no-files-found: error

  publish-django:
    name: Publish Django to PyPI
    needs: build-django
    if: needs.build-django.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/solex-usx-django
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: django-distributions
          path: dist

      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
