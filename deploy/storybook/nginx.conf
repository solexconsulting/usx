server {
    listen 6006;
    root /storybook-static;
    index index.html;

    location / {
        # Serve the exact file if it exists, then try as a directory (serves
        # index.html), then 404. Do NOT fall back to index.html for unknown
        # paths — that would cause /iframe.html to redirect like SPA mode.
        try_files $uri $uri/ =404;
    }
}
